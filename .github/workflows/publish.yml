# Publica as features e a imagem base no GHCR.
#
# Sem segredo extra: o GITHUB_TOKEN do proprio repositorio basta, com `packages: write`.
# As features saem em ghcr.io/huldlabs/endurance/<feature> e a base em
# ghcr.io/huldlabs/endurance/base — o mesmo namespace, para o projeto nao ter de saber
# de onde cada peca veio.
name: publish

on:
  # So tag `v*` publica: a main pode quebrar a vontade que nada vai para o GHCR.
  # A tag e o numero da versao, e so' o dono cria: `git tag v0.0.1-dev.3 && git push origin v0.0.1-dev.3`.
  push:
    tags: ["v*"]
  # Republica uma tag que ja' existe (rode escolhendo a TAG como ref; na main o job recusa).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # A imagem base primeiro: as features sao instaladas SOBRE ela, entao publicar uma
  # feature que a base nao suporta deixaria o projeto quebrado sem aviso.
  base:
    runs-on: ubuntu-latest
    # O digest vai para as notas da Release: o consumidor fixa a base por digest, nunca pela tag.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # O pacote ghcr.io/huldlabs/tars e' PRIVADO e a base o copia por digest (D17). Dois
      # logins no mesmo registry se substituem (F16), entao o build roda SO' com o de leitura
      # e carrega a imagem no docker local; o login de push vem depois, so' para o push.
      # Token so' por secret do repo; nunca em log nem argv.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_READ_USER }}
          password: ${{ secrets.GHCR_READ_TOKEN }}

      # A versao sai da TAG, nao do arquivo: `v0.0.1-dev.3` publica `base:0.0.1-dev.3`.
      # Pre-release (versao com `-`) NAO move a tag curta (`:0`): as duas viram a versao cheia.
      - name: Version from tag
        id: version
        run: |
          # workflow_dispatch so' republica uma TAG (escolha a tag como ref): na main sairia `base:main`.
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "publish so' roda em tag v* (ref atual: $GITHUB_REF_NAME)" >&2; exit 1; }
          full="${GITHUB_REF_NAME#v}"
          major="${full%%.*}"
          case "$full" in *-*) major="$full" ;; esac
          {
            echo "full=${full}"
            echo "major=${major}"
            echo "tags<<EOF"
            echo "ghcr.io/huldlabs/endurance/base:${full}"
            [ "$major" = "$full" ] || echo "ghcr.io/huldlabs/endurance/base:${major}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: images/base
          file: images/base/Dockerfile
          load: true
          push: false
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push base
        id: push
        env:
          FULL: ${{ steps.version.outputs.full }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          docker push "ghcr.io/huldlabs/endurance/base:${FULL}"
          [ "$MAJOR" = "$FULL" ] || docker push "ghcr.io/huldlabs/endurance/base:${MAJOR}"
          # RepoDigests so' existe depois do push: e' o digest do manifest no registry.
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/huldlabs/endurance/base:${FULL}")"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

  features:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `publish` publica CADA pasta em src/* como uma feature. O owner/namespace sai do
      # GITHUB_TOKEN — nao ha string de registry escrita a mao aqui que possa divergir.
      - name: Publish features
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A Release do GitHub, POR ULTIMO (metodologia do Tars, release.yml dele): so' depois da base e
  # das features publicadas E provadas no registry. Notas pelo `tars release-notes` (CHANGELOG +
  # artefatos), nunca escritas a mao; anexos: o catalogo gerado + sha256sums.
  release:
    needs: [base, features]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # criar a Release
      packages: read # provar base e features no GHCR
    env:
      BASE: ghcr.io/huldlabs/endurance/base
      BASE_DIGEST: ${{ needs.base.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # a tag anterior entra no link de comparacao das notas

      # Login do proprio repo primeiro (os pacotes endurance/*); o de leitura do tars vem depois,
      # porque dois logins no mesmo registry se substituem (F16).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Feature: a versao cheia E a tag curta `:<major>` (a que o projeto usa) tem de existir e
      # apontar para o MESMO digest; major atrasado = projeto recebendo a versao velha calado.
      - name: Provar a base (por digest) e cada feature (versao cheia e major, mesmo digest)
        run: |
          set -euo pipefail
          [ -n "$BASE_DIGEST" ] || { echo "job base nao entregou o digest" >&2; exit 1; }
          docker run --rm "${BASE}@${BASE_DIGEST}" sh -c 'tars --version && git --version && op --version && rg --version'
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          for f in src/*/devcontainer-feature.json; do
            id="$(jq -r .id "$f")"; v="$(jq -r .version "$f")"
            cheia="ghcr.io/huldlabs/endurance/${id}:${v}"; curta="ghcr.io/huldlabs/endurance/${id}:${v%%.*}"
            dc="$(digest "$cheia")" || { echo "feature ausente no GHCR: $cheia" >&2; exit 1; }
            dm="$(digest "$curta")" || { echo "feature ausente no GHCR: $curta" >&2; exit 1; }
            if [ -z "$dc" ] || [ "$dc" != "$dm" ]; then echo "digest diverge: $cheia=$dc $curta=$dm" >&2; exit 1; fi
            echo "ok $cheia = $curta ($dc)"
          done

      - name: Artefatos (catalogo gerado + sha256sums)
        run: |
          set -euo pipefail
          # O catalogo anexado e' o GERADO desta tag; divergir do commitado e' erro (test.yml cobra o mesmo).
          bash tools/gen-catalogo.sh --check
          mkdir dist
          cp docs/catalogo.md dist/catalogo.md
          (cd dist && sha256sum catalogo.md > sha256sums && cat sha256sums)

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_READ_USER }}
          password: ${{ secrets.GHCR_READ_TOKEN }}

      # O tars e' o MESMO da base: a imagem do ARG TARS_IMAGE, por digest (R3, fonte unica).
      - name: Gerar as notas (tars release-notes)
        run: |
          set -euo pipefail
          versao="${GITHUB_REF_NAME#v}"
          tars_image="$(sed -n 's/^ARG TARS_IMAGE=//p' images/base/Dockerfile)"
          case "$tars_image" in *@sha256:*) ;; *) echo "ARG TARS_IMAGE sem digest" >&2; exit 1 ;; esac
          prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          docker run --rm -u "$(id -u):$(id -g)" -e TARS_EMBED_CACHE=/tmp/tars-cache -v "$PWD:/w" -w /w "$tars_image" \
            release-notes --version "$versao" --bin endurance --dist dist --repo "$GITHUB_REPOSITORY" \
            --run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            ${prev:+--prev "$prev"} --out notes.md
          # O texto de verificacao do tars fala de "binario por libc" (do Tars); aqui o provado e' a base e as features.
          sed -i 's/ — cada binário provado rodando na sua libc e arquitetura antes de publicar\./ — base e features provadas no GHCR antes de publicar./' notes.md
          {
            echo
            echo "## Imagem base e features"
            echo
            echo '```'
            echo "${BASE}:${versao}"
            echo "${BASE}@${BASE_DIGEST}"
            echo '```'
            echo
            echo "Fixe a base por digest no \`devcontainer.json\`/\`Dockerfile\`. Features: \`ghcr.io/huldlabs/endurance/<id>:<major>\`;"
            echo "o catálogo anexo (\`catalogo.md\`) lista cada ferramenta da base e todas as options de cada feature."
          } >> notes.md
          head -40 notes.md

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          # Versao com `-` (ex.: 0.0.1-dev.3) e' pre-release: nao vira a "Latest" do repo.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/catalogo.md
            dist/sha256sums
