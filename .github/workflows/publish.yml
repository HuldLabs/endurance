# Publica as features e a imagem base no GHCR.
#
# Sem segredo extra: o GITHUB_TOKEN do proprio repositorio basta, com `packages: write`.
# As features saem em ghcr.io/huldlabs/endurance/<feature> e a base em
# ghcr.io/huldlabs/endurance/base — o mesmo namespace, para o projeto nao ter de saber
# de onde cada peca veio.
name: publish

on:
  # So tag `v*` publica: a main pode quebrar a vontade que nada vai para o GHCR.
  # A tag e o numero da versao — `git tag v1.2.0 && git push origin v1.2.0`.
  push:
    tags: ["v*"]
  # Permite republicar sem criar tag (ex.: apos um retry de job que falhou).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # A imagem base primeiro: as features sao instaladas SOBRE ela, entao publicar uma
  # feature que a base nao suporta deixaria o projeto quebrado sem aviso.
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A versao sai da TAG, nao do arquivo: `v1.2.0` publica `base:1.2.0` e `base:1`.
      # O `:1` continua sendo o que os projetos consomem; o `:1.2.0` fica para pinar.
      - name: Version from tag
        id: version
        run: |
          full="${GITHUB_REF_NAME#v}"
          major="${full%%.*}"
          # Pre-release (v1.2.0-rc1) NAO move o `:1` que os projetos consomem: as duas tags
          # viram a versao cheia.
          case "$full" in *-*) major="$full" ;; esac
          echo "full=${full}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: images/base
          file: images/base/Dockerfile
          push: true
          tags: |
            ghcr.io/huldlabs/endurance/base:${{ steps.version.outputs.full }}
            ghcr.io/huldlabs/endurance/base:${{ steps.version.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  features:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `publish` publica CADA pasta em src/* como uma feature. O owner/namespace sai do
      # GITHUB_TOKEN — nao ha string de registry escrita a mao aqui que possa divergir.
      - name: Publish features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
