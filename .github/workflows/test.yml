# Testa as features (scenarios em test/<feature>/) sobre a imagem base buildada no proprio
# job — a mesma tag local que os scenarios.json referenciam (endurance-base:local).
# Roda em PR e na main; a publicacao (publish.yml) e' so' por tag.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [node-bun, playwright, agent-browser, php, mysql-client, redis-client, pwsh, secrets, signing]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # O pacote ghcr.io/huldlabs/tars e' PRIVADO e a base o copia por digest (D17): login de
      # LEITURA antes de qualquer build. Token so' por secret do repo; nunca em log nem argv.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_READ_USER }}
          password: ${{ secrets.GHCR_READ_TOKEN }}
      - name: Build base
        run: docker build -t endurance-base:local images/base
      # ENDURANCE_UNPUBLISHED=1 ate a primeira tag: o installsAfter das features do proprio
      # repo ainda nao resolve no GHCR (ver tools/test-features.sh). Tirar apos a v0.0.1-dev.3 (F12).
      - name: Test feature
        env:
          ENDURANCE_UNPUBLISHED: "1"
        run: tools/test-features.sh ${{ matrix.feature }}
